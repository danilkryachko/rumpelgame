syntax = "proto3";

package rumpelmc.api;
option go_package = "rumpelmc/server/pkg/api";

enum ChunkEncoding {
  CHUNK_ENCODING_RAW = 0;
  CHUNK_ENCODING_RLE = 1;
}

message ChunkData {
  int32 x = 1;
  int32 z = 2;
  // Compacted block IDs or full array
  bytes blocks = 3;
  ChunkEncoding encoding = 4;
  uint32 uncompressed_size = 5;
}

message ClientPosition {
  float x = 1;
  float y = 2;
  float z = 3;
  string player_id = 4;
}

message BlockAction {
  enum ActionType {
    DESTROY = 0;
    PLACE = 1;
  }
  ActionType action = 1;
  int32 x = 2;
  int32 y = 3;
  int32 z = 4;
  uint32 block_id = 5; // Ignored for DESTROY
}

message InventorySlot {
  uint32 block_id = 1;
  uint32 count = 2;
}

message InventorySnapshot {
  repeated InventorySlot slots = 1;
  uint32 selected_slot = 2;
  uint32 selected_tool_slot = 3;
}

message InventoryAction {
  enum ActionType {
    SELECT_SLOT = 0;
    SELECT_TOOL_SLOT = 1;
  }
  ActionType action = 1;
  uint32 slot = 2;
  uint32 tool_slot = 3;
}

message ItemEntity {
  uint64 entity_id = 1;
  string item_id = 2;
  uint32 count = 3;
  float x = 4;
  float y = 5;
  float z = 6;
}

message ItemEntitySnapshot {
  repeated ItemEntity entities = 1;
  uint64 revision = 2;
}

message ItemPickupAction {
  uint64 entity_id = 1;
}

message Packet {
  oneof payload {
    ChunkData chunk = 1;
    ClientPosition position = 2;
    BlockAction block_action = 3;
    InventorySnapshot inventory_snapshot = 4;
    InventoryAction inventory_action = 5;
    ItemEntitySnapshot item_entities = 6;
    ItemPickupAction item_pickup = 7;
  }
}
